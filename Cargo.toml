[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/kesharon-application",
  "crates/kesharon-daemon",
  "crates/kesharon-domain",
  "crates/kesharon-ipc",
  "crates/kesharon-protocol",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/Mujadarah/Kesharon"

[workspace.dependencies]
kesharon-domain = { path = "crates/kesharon-domain" }
kesharon-protocol = { path = "crates/kesharon-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
interprocess = "2.4.2"
widestring = "1.2.1"
getrandom = "0.4.3"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = "2.6.3"
tauri-plugin-shell = "2.3.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_field_names = "allow"
